changelog:
  categories:
    - title: 🛠 Breaking Changes
      labels:
        - Semver-Major
        - breaking-changes
    - title: 🎉 New Features
      labels:
        - Semver-Minor
        - enhancement
    - title: ⚠️ Deprecation
      labels:
        - deprecation
    - title: 🐞 Bug fixes
      labels:
        - bug
    - title: 📔 Documentation
      labels:
        - documentation
    - title: 🤖 CI
      labels:
        - ci
      exclude:
        labels:
          - renovate
    - title: renovate/dependabot
      labels:
        - renovate
        - dependencies
        - github_actions
    - title: Other changes
      labels:
        - '*'
